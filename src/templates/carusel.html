{% load static %}
<section>
  <div id="carouselExampleCaptions" class="carousel slide container" data-ride="carousel" data-interval="5000">
	<!-- Indicators -->
	<ol class="carousel-indicators">
	  {% for slide in slider_list %}
		<li data-target="#carouselExampleCaptions" data-slide-to="{{ forloop.counter0 }}" class="{% if forloop.first %}active{% endif %}"></li>
	  {% endfor %}
	</ol>

	<div class="carousel-inner">
	  {% for slide in slider_list %}
	  <div class="carousel-item {% if forloop.first %}active{% endif %} {{ slide.cms_css|default:'' }}">
	  {% if slide.cms_img %}
	  <img src="{{ slide.cms_img.url }}" class="d-block w-100" alt="{{ slide.cms_title|default:'slide' }}">
	   {% else %}
	   <img src="{% static 'images/Shop-logo.png' %}" class="d-block w-100" alt="{{ slide.cms_title|default:'slide' }}">
	  {% endif %}
	    <div class="carousel-caption d-none d-md-block">
	  <h5 class="slaider_h">{{ slide.cms_title }}</h5>
	   <p class="slaider_p">{{ slide.cms_text }}</p>
	  </div>
	  </div>
	  {% empty %}
	  <div class="carousel-item active">
	  <img src="{% static 'images/Shop-logo.png' %}" class="d-block w-100" alt="placeholder">
	    <div class="carousel-caption d-none d-md-block">
	  <h5 class="slaider_h">Welcome to the shop</h5>
			<p class="slaider_p">Browse our products below.</p>
		  </div>
		</div>
	  {% endfor %}
	</div>

	<a class="carousel-control-prev" href="#carouselExampleCaptions" role="button" data-slide="prev">
	  <span class="carousel-control-prev-icon" aria-hidden="true"></span>
	  <span class="sr-only">Previous</span>
	</a>
	<a class="carousel-control-next" href="#carouselExampleCaptions" role="button" data-slide="next">
	  <span class="carousel-control-next-icon" aria-hidden="true"></span>
	  <span class="sr-only">Next</span>
	</a>
  </div>
</section>
