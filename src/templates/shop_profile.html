{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Shop Profile</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/shop_profile.css' %}">
</head>
<body>
    <div class="shop-profile-card">
        <div class="shop-profile-badge"><i class="fas fa-store"></i></div>
        <div class="shop-profile-avatar">{{ user.username|slice:":1"|upper }}</div>
        <div class="shop-profile-header">Hello, {{ user.username }}!</div>
        <div class="shop-profile-email">{{ user.email }}</div>
        <div class="shop-profile-phone">{{ user.phone|default:"No phone added" }}</div>

        <a class="shop-profile-back" href="{% url 'shop' %}"><i class="fas fa-arrow-left"></i> Back to the shop</a>
        <a class="shop-profile-logout" href="{% url 'logout' %}"><i class="fas fa-sign-out-alt"></i> Log out</a>
    </div>
</body>
</html>
